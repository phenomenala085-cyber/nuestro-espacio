name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar Supabase
        run: |
          curl -sS -o /dev/null -w "Respuesta HTTP %{http_code}\n" "${{ secrets.SUPABASE_URL }}/rest/v1/docs?select=path&limit=1" -H "apikey: ${{ secrets.SUPABASE_KEY }}"
